[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-interp"
version = "0.1.0"
description = "Mechanistic interpretability toolkit: discovery methods -> evidence store -> classifier + inspection -> LLM Rosetta Stone -> tested predictions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
tb = ["tensorboard>=2.14"]          # optional: JSON summaries are always written
hf = ["transformers>=4.40"]         # optional: HFAdapter (untested path)

[project.scripts]
rosetta = "rosetta.cli:main"

[tool.setuptools.packages.find]
include = ["rosetta*"]
