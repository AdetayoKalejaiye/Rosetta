<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosetta</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">Rosetta</div>
  <label class="field">
    <span>Run</span>
    <select id="run-select"></select>
  </label>
  <div id="run-meta" class="meta"></div>
  <div class="spacer"></div>
  <span id="model-status" class="model-status" title=""></span>
  <button id="view-toggle" class="ghost-btn" type="button">Table view</button>
</header>

<main>
  <!-- ----------------------------------------------------------- grid -->
  <section id="grid-panel">
    <div class="panel-bar">
      <label class="field">
        <span>Colour by</span>
        <select id="metric-select"></select>
      </label>
      <div id="scale-legend" class="scale-legend"></div>
      <div class="spacer"></div>
      <button id="clear-focus" class="ghost-btn hidden" type="button">
        Clear highlight
      </button>
    </div>

    <div id="label-bar" class="label-bar"></div>

    <div id="grid-scroll">
      <div id="grid-host"></div>
      <div id="empty-state" class="empty hidden"></div>
    </div>

    <div id="table-host" class="hidden"></div>
  </section>

  <!-- ------------------------------------------------------- side panel -->
  <section id="side-panel">
    <nav class="tabs">
      <button class="tab active" data-tab="detail">Component</button>
      <button class="tab" data-tab="chat">Ask</button>
    </nav>

    <div id="tab-detail" class="tab-body">
      <div id="detail-empty" class="empty">
        Select a cell in the grid to inspect a component.
      </div>
      <div id="detail-content"></div>
    </div>

    <div id="tab-chat" class="tab-body hidden">
      <div id="messages"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" type="text"
               placeholder="Which heads do induction?">
        <button type="submit" id="send-btn">Ask</button>
      </form>
    </div>
  </section>
</main>

<div id="tooltip" class="tooltip hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
